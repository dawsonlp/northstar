uri: req://validators/validate-code-ast
title: Validate Code AST Invariants
intent: Executes registered invariant validators against proposed Python code and returns structured diagnostics.
component: validators
contract:
  preconditions:
    - description: Code content must be parseable Python source or raw string
  postconditions:
    - description: Returns empty list if clean, or list of ConstraintViolation diagnostics with actionable remediation hints.
failure_modes:
  - error_name: ASTParseError
    trigger_condition: Python syntax error in code snippet
    recovery_action: Safely ignore or return syntax error violation
governed_by:
  - decision://arch/adr-0002-dual-declarative-executable-constraints
  - decision://arch/adr-0005-invariant-evaluation-strategy-and-safe-execution
constraints:
  - constraint://northstar/no-direct-db-import
lifecycle: ACTIVE
tags:
  - guardrails
  - ast

