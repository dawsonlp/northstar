uri: req://ecommerce/create-order
title: Create Customer Order
intent: Assembles customer line items into a persistent order entity with status DRAFT.
domain: ecommerce
component: orders
lifecycle: ACTIVE
contract:
  preconditions:
    - description: Customer account must be active.
    - description: Line items list must not be empty.
  postconditions:
    - description: Order entity is initialized in DRAFT state with computed total cents.
  state_transitions:
    - from_state: null
      to_state: DRAFT
      trigger: Initialize Checkout
failure_modes:
  - error_name: InvalidCustomerStateError
    trigger_condition: Customer account is suspended or not found.
    recovery_action: Prompt user to re-authenticate or verify customer account.
  - error_name: EmptyCartError
    trigger_condition: Line items list is empty.
    recovery_action: Reject transaction and request at least one product SKU.
operated_entities:
  reads:
    - data://logical/ecommerce/Customer
    - data://logical/ecommerce/Product
  creates:
    - data://logical/ecommerce/Order
    - data://logical/ecommerce/OrderItem
  mutates: []

