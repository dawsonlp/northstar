version: '3.8'

services:
  northstar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-control-plane
    ports:
      - "9480:9480"
    environment:
      - NORTHSTAR_WORKSPACE_ROOT=/workspace
      - PORT=9480
      - PYTHONUNBUFFERED=1
    volumes:
      - ../:/workspace
    restart: unless-stopped
