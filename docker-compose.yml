version: '3.8'

services:
  northstar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-control-plane
    ports:
      - "8080:8080"
    environment:
      - NORTHSTAR_WORKSPACE_ROOT=/workspace
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/workspace
    restart: unless-stopped
